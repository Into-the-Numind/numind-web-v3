name: Numind Web v3 CI/CD

on:
  push:
    branches:
      - main
      - develop
      - release
      - feature/sales-agent-vue3-migration
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  
  workflow_dispatch:
    inputs:
      refresh_cache:
        description: '刷新 Docker 缓存'
        type: boolean
        required: false
        default: false

env:
  DOCKERHUB_USERNAME: pmtmyaggy
  IMAGE_NAME: pmtmyaggy/numind-web-v3

jobs:
  # =====================================================
  # 构建并推送镜像
  # =====================================================
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # =====================================================
      # 计算镜像标签（根据分支/tag）
      # develop → develop
      # release → release
      # main → latest
      # tag v* → 版本号
      # =====================================================
      - name: Calculate Metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Tag 触发 → 生产环境
            IMAGE_TAG="${{ github.ref_name }}"
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "::notice::🚀 生产环境构建: $IMAGE_TAG"
          elif [ "${{ github.ref_name }}" = "release" ]; then
            # release 分支 → QA 环境
            IMAGE_TAG="release"
            echo "environment=qa" >> $GITHUB_OUTPUT
            echo "::notice::🚀 QA环境构建: release"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            # develop 分支 → Dev 环境
            IMAGE_TAG="develop"
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "::notice::🚀 开发环境构建: develop"
          elif [ "${{ github.ref_name }}" = "feature/sales-agent-vue3-migration" ]; then
            # staging 分支 → Staging 环境
            IMAGE_TAG="staging"
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "::notice::🚀 Staging环境构建: staging"
          else
            # main 或其他分支
            IMAGE_TAG="latest"
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "::notice::🚀 生产环境构建: latest"
          fi
          
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
          build-args: |
            VITE_APP_ENV=${{ steps.meta.outputs.environment }}
            VITE_API_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify success
        run: |
          echo "✅ 镜像构建完成"
          echo "镜像: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}"
          echo "环境: ${{ steps.meta.outputs.environment }}"

  # =====================================================
  # 部署到 Dev 环境 (49.233.219.254)
  # =====================================================
  deploy_dev:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: development
    steps:
      - name: Deploy to Dev Server (49.233.219.254)
        uses: appleboy/ssh-action@master
        with:
          host: 49.233.219.254
          username: root
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          script: |
            echo "🚀 部署到 Dev 环境..."
            
            # 强制清理可能卡住的容器
            docker stop numind-web-v3-dev 2>/dev/null || true
            docker rm -f numind-web-v3-dev 2>/dev/null || true
            sleep 2
            
            # 拉取最新镜像
            docker pull ${{ env.IMAGE_NAME }}:develop
            
            # 启动新容器
            docker run -d \
              --name numind-web-v3-dev \
              --network numind-network \
              -p 9200:80 \
              -e API_PROXY_PASS="http://numind-server-dev:9091/" \
              --restart unless-stopped \
              ${{ env.IMAGE_NAME }}:develop

            sleep 3
            docker ps | grep numind-web-v3-dev || echo "容器启动失败"
            echo "✅ Dev 部署完成"

  # =====================================================
  # 部署到 QA 环境 (49.233.219.254)
  # =====================================================
  deploy_qa:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release'
    environment: qa
    steps:
      - name: Deploy to QA Server (49.233.219.254)
        uses: appleboy/ssh-action@master
        with:
          host: 49.233.219.254
          username: root
          password: ${{ secrets.DEV_SERVER_PASSWORD }}
          script: |
            echo "🚀 部署到 QA 环境..."
            
            # 强制清理可能卡住的容器
            docker stop numind-web-v3-qa 2>/dev/null || true
            docker rm -f numind-web-v3-qa 2>/dev/null || true
            sleep 2
            
            # 拉取最新镜像
            docker pull ${{ env.IMAGE_NAME }}:release
            
            # 启动新容器
            docker run -d \
              --name numind-web-v3-qa \
              --network numind-network \
              -p 9201:80 \
              -e API_PROXY_PASS="http://numind-server-qa:9091/" \
              --restart unless-stopped \
              ${{ env.IMAGE_NAME }}:release

            sleep 3
            docker ps | grep numind-web-v3-qa || echo "容器启动失败"
            echo "✅ QA 部署完成"

  # =====================================================
  # 部署到 Prod 环境 (129.28.125.51)
  # =====================================================
  deploy_prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: Deploy to Prod Server (129.28.125.51)
        uses: appleboy/ssh-action@master
        with:
          host: 129.28.125.51
          username: root
          password: ${{ secrets.PROD_SERVER_PASSWORD }}
          script: |
            echo "🚀 部署到 Prod 环境..."
            
            # 根据触发方式确定镜像标签
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              IMAGE_TAG="${{ github.ref_name }}"
            else
              IMAGE_TAG="latest"
            fi
            
            # 强制清理可能卡住的容器
            docker stop numind-web-v3 2>/dev/null || true
            docker rm -f numind-web-v3 2>/dev/null || true
            sleep 2
            
            docker pull ${{ env.IMAGE_NAME }}:$IMAGE_TAG
            
            # 启动新容器
            docker run -d \
              --name numind-web-v3 \
              --network numind-network \
              -p 9202:80 \
              -e API_PROXY_PASS="http://numind-server-prod:9091/" \
              --restart unless-stopped \
              ${{ env.IMAGE_NAME }}:$IMAGE_TAG
            
            sleep 3
            docker ps | grep numind-web-v3 || echo "容器启动失败"
            echo "✅ Prod 部署完成"

  # =====================================================
  # 部署到 Staging 环境 (110.42.221.25)
  # 验证 feature/sales-agent-vue3-migration 分支
  # =====================================================
  deploy_staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/sales-agent-vue3-migration'
    environment: staging
    steps:
      - name: Deploy to Staging Server (110.42.221.25)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: root
          password: ${{ secrets.STAGING_SERVER_PASSWORD }}
          script: |
            echo "🚀 部署到 Staging 环境..."

            # 强制清理可能卡住的容器
            docker stop numind-web-v3-staging 2>/dev/null || true
            docker rm -f numind-web-v3-staging 2>/dev/null || true
            sleep 2

            # 拉取最新镜像
            docker pull ${{ env.IMAGE_NAME }}:staging

            # 启动新容器（host 网络模式，Nginx 监听 80，后端在同一台服务器 9091）
            docker run -d \
              --name numind-web-v3-staging \
              --network host \
              -e API_PROXY_PASS="http://localhost:9091/" \
              --restart unless-stopped \
              ${{ env.IMAGE_NAME }}:staging

            sleep 3
            docker ps | grep numind-web-v3-staging || echo "容器启动失败"

            # 健康检查
            curl -sf http://localhost:80/health && echo "✅ 健康检查通过" || echo "⚠️ 健康检查失败"
            echo "✅ Staging 部署完成"
