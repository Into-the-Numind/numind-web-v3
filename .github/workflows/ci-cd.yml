name: Numind Web v3 CI/CD

on:
  push:
    branches:
      - main
      - develop
      - release
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  
  workflow_dispatch:
    inputs:
      refresh_cache:
        description: '刷新 Docker 缓存'
        type: boolean
        required: false
        default: false

env:
  DOCKERHUB_USERNAME: neozhang96
  IMAGE_NAME: neozhang96/numind-web-v3

jobs:
  # =====================================================
  # 构建并推送镜像
  # =====================================================
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # =====================================================
      # 计算镜像标签（根据分支/tag）
      # develop → develop
      # release → release
      # main → latest
      # tag v* → 版本号
      # =====================================================
      - name: Calculate Metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Tag 触发 → 生产环境
            IMAGE_TAG="${{ github.ref_name }}"
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "::notice::🚀 生产环境构建: $IMAGE_TAG"
          elif [ "${{ github.ref_name }}" = "release" ]; then
            # release 分支 → QA 环境
            IMAGE_TAG="release"
            echo "environment=qa" >> $GITHUB_OUTPUT
            echo "::notice::🚀 QA环境构建: release"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            # develop 分支 → Dev 环境
            IMAGE_TAG="develop"
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "::notice::🚀 开发环境构建: develop"
          else
            # main 或其他分支
            IMAGE_TAG="latest"
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "::notice::🚀 生产环境构建: latest"
          fi
          
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify success
        run: |
          echo "✅ 镜像构建完成"
          echo "镜像: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}"
          echo "环境: ${{ steps.meta.outputs.environment }}"