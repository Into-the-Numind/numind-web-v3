<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>有数选题采集</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="ys-popup">
      <header class="ys-header">
        <span class="ys-logo">有数</span>
        <span class="ys-title">选题采集</span>
      </header>

      <section class="ys-status-card">
        <div class="ys-row">
          <span class="ys-label">授权状态</span>
          <span id="auth-status" class="ys-badge ys-badge--pending">检测中…</span>
        </div>
        <div class="ys-row">
          <span class="ys-label">已采集</span>
          <span id="collected-count" class="ys-value">0</span>
        </div>
      </section>

      <p id="auth-hint" class="ys-hint">
        请先在有数选题库网页登录并点击「连接采集插件」完成授权。
      </p>

      <div class="ys-actions">
        <a id="open-library" class="ys-btn ys-btn--primary" href="#" target="_blank" rel="noopener"
          >打开选题库</a
        >
        <button id="clear-token" class="ys-btn ys-btn--ghost">解除授权</button>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
